<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img"><rect width="560" height="360" fill="#fff"/><text x="10" y="20" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Three-tier architecture for web airline booking</text><rect x="40" y="50" width="210" height="64" rx="6" fill="#e8f0ff" stroke="#1f2d4d" stroke-width="1.4"/><text x="145.0" y="75.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Client tier</text><text x="145.0" y="92.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">customer&#x27;s browser or app</text><rect x="40" y="160" width="210" height="74" rx="6" fill="#fff1dc" stroke="#1f2d4d" stroke-width="1.4"/><text x="145.0" y="190.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Application server tier</text><text x="145.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">fares, seat rules, payments</text><rect x="40" y="280" width="210" height="64" rx="6" fill="#f3e8ff" stroke="#1f2d4d" stroke-width="1.4"/><text x="145.0" y="305.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Database server tier</text><text x="145.0" y="322.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">flights, seats, bookings</text><line x1="145" y1="114" x2="145" y2="160" stroke="#1f2d4d" stroke-width="1.4"/><path d="M 145.0 160.0 L 141.5 151.7 L 148.5 151.7 Z" fill="#1f2d4d"/><path d="M 145.0 114.0 L 148.5 122.3 L 141.5 122.3 Z" fill="#1f2d4d"/><line x1="145" y1="234" x2="145" y2="280" stroke="#1f2d4d" stroke-width="1.4"/><path d="M 145.0 280.0 L 141.5 271.7 L 148.5 271.7 Z" fill="#1f2d4d"/><path d="M 145.0 234.0 L 148.5 242.3 L 141.5 242.3 Z" fill="#1f2d4d"/><text x="155" y="142" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#6b3fa0" style="font-family:Inter,Helvetica,Arial,sans-serif">HTTPS: forms in, web pages out</text><text x="155" y="262" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#6b3fa0" style="font-family:Inter,Helvetica,Arial,sans-serif">SQL via JDBC/ODBC (only this tier)</text><text x="290" y="80" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Thin client: nothing to install</text><text x="290" y="190" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Business rules in one place;</text><text x="290" y="206" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">many servers share the load</text><text x="290" y="305" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Concurrency control: no double-booked seat</text><text x="290" y="321" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Recovery: no half-made booking</text></svg>