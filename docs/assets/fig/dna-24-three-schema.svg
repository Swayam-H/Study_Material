<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" role="img"><rect width="760" height="478" fill="#fff"/><text x="10" y="20" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Three-schema architecture (Elmasri Fig 2.2)</text><text x="20" y="62" font-size="12" text-anchor="start" font-style="italic" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">End users</text><rect x="120" y="45" width="150" height="46" rx="6" fill="#e8f0ff" stroke="#1f2d4d" stroke-width="1.4"/><text x="195.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">External view 1</text><text x="195.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">external schema</text><rect x="300" y="45" width="150" height="46" rx="6" fill="#e8f0ff" stroke="#1f2d4d" stroke-width="1.4"/><text x="375.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">External view 2</text><text x="375.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">external schema</text><rect x="480" y="45" width="150" height="46" rx="6" fill="#e8f0ff" stroke="#1f2d4d" stroke-width="1.4"/><text x="555.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">External view n</text><text x="555.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">external schema</text><text x="20" y="82" font-size="10" text-anchor="start" font-style="italic" font-weight="400" fill="#555" style="font-family:Inter,Helvetica,Arial,sans-serif">EXTERNAL LEVEL</text><rect x="150" y="165" width="450" height="50" rx="6" fill="#fff1dc" stroke="#1f2d4d" stroke-width="1.4"/><text x="375.0" y="183.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Conceptual schema</text><text x="375.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">whole database: entities, relationships, constraints</text><text x="20" y="194" font-size="10" text-anchor="start" font-style="italic" font-weight="400" fill="#555" style="font-family:Inter,Helvetica,Arial,sans-serif">CONCEPTUAL LEVEL</text><line x1="195" y1="91" x2="195" y2="165" stroke="#1f2d4d" stroke-width="1.4"/><path d="M 195.0 165.0 L 191.5 156.7 L 198.5 156.7 Z" fill="#1f2d4d"/><path d="M 195.0 91.0 L 198.5 99.3 L 191.5 99.3 Z" fill="#1f2d4d"/><line x1="375" y1="91" x2="375" y2="165" stroke="#1f2d4d" stroke-width="1.4"/><path d="M 375.0 165.0 L 371.5 156.7 L 378.5 156.7 Z" fill="#1f2d4d"/><path d="M 375.0 91.0 L 378.5 99.3 L 371.5 99.3 Z" fill="#1f2d4d"/><line x1="555" y1="91" x2="555" y2="165" stroke="#1f2d4d" stroke-width="1.4"/><path d="M 555.0 165.0 L 551.5 156.7 L 558.5 156.7 Z" fill="#1f2d4d"/><path d="M 555.0 91.0 L 558.5 99.3 L 551.5 99.3 Z" fill="#1f2d4d"/><text x="390" y="135" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#6b3fa0" style="font-family:Inter,Helvetica,Arial,sans-serif">external/conceptual mappings</text><rect x="150" y="280" width="450" height="50" rx="6" fill="#f3e8ff" stroke="#1f2d4d" stroke-width="1.4"/><text x="375.0" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Internal schema</text><text x="375.0" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">files, record placement, indexes, access paths</text><text x="20" y="309" font-size="10" text-anchor="start" font-style="italic" font-weight="400" fill="#555" style="font-family:Inter,Helvetica,Arial,sans-serif">INTERNAL LEVEL</text><line x1="375" y1="215" x2="375" y2="280" stroke="#1f2d4d" stroke-width="1.4"/><path d="M 375.0 280.0 L 371.5 271.7 L 378.5 271.7 Z" fill="#1f2d4d"/><path d="M 375.0 215.0 L 378.5 223.3 L 371.5 223.3 Z" fill="#1f2d4d"/><text x="385" y="252" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#6b3fa0" style="font-family:Inter,Helvetica,Arial,sans-serif">conceptual/internal mapping</text><path d="M 270 370 L 270 410 A 105 14 0 0 0 480 410 L 480 370" fill="#eef6ee" stroke="#1f2d4d" stroke-width="1.4"/><ellipse cx="375" cy="370" rx="105" ry="14" fill="#eef6ee" stroke="#1f2d4d" stroke-width="1.4"/><text x="375" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Stored database</text><line x1="375" y1="330" x2="375" y2="356" stroke="#1f2d4d" stroke-width="1.4"/><path d="M 375.0 356.0 L 371.5 347.7 L 378.5 347.7 Z" fill="#1f2d4d"/><path d="M 375.0 330.0 L 378.5 338.3 L 371.5 338.3 Z" fill="#1f2d4d"/><text x="20" y="445" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Logical data independence: change the conceptual schema, keep external schemas (only the upper mappings change).</text><text x="20" y="463" font-size="11" text-anchor="start" font-style="italic" font-weight="400" fill="#1f2d4d" style="font-family:Inter,Helvetica,Arial,sans-serif">Physical data independence: change the internal schema, keep the conceptual schema (only the lower mapping changes).</text></svg>